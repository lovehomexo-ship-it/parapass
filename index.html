<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- Icône d'écran d'accueil iOS : iOS ignore le manifest et utilise CETTE balise. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ParaPass" />
    <!-- Manifest OBLIGATOIRE : sans lui le navigateur ne lit jamais manifest.json
         → PWA non installable correctement et push iOS impossible (exigence Apple). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ParaPass — Carnet de sauts numérique FFP</title>
    <meta name="description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parapass.fr" />
    <meta property="og:title" content="ParaPass — Carnet de sauts numérique FFP" />
    <meta property="og:description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />
    <meta property="og:image" content="https://parapass.fr/Logo_ParaPass.png" />
    <meta property="og:image:alt" content="Logo ParaPass" />
    <meta property="og:site_name" content="ParaPass" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParaPass — Carnet de sauts numérique FFP" />
    <meta name="twitter:description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />
    <meta name="twitter:image" content="https://parapass.fr/Logo_ParaPass.png" />
    <style>
      /* Écran de démarrage : styles inline pour s'afficher sans attendre le CSS. */
      .pp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:12px;background:#001A4D;
        font-family:Inter,system-ui,-apple-system,sans-serif}
      .pp-boot p{margin:0;font-size:14px;color:#94A3B8}
      .pp-ciel{position:relative;width:190px;height:150px}
      @keyframes ppBalancier{0%,100%{transform:rotate(-7deg) translateX(-10px)}
        50%{transform:rotate(7deg) translateX(10px)}}
      @keyframes ppFlotte{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
      @keyframes ppNuage{0%{transform:translateY(-24px);opacity:0}20%{opacity:.30}
        80%{opacity:.30}100%{transform:translateY(150px);opacity:0}}
      .pp-balancier{width:100%;height:100%;transform-origin:50% 8%;
        animation:ppBalancier 3.6s ease-in-out infinite}
      .pp-flotte{width:100%;height:100%;animation:ppFlotte 2.6s ease-in-out infinite}
      .pp-para{width:100%;height:100%;object-fit:contain;
        filter:brightness(0) invert(1) drop-shadow(0 6px 18px rgba(96,165,250,.45))}
      .pp-nuage{position:absolute;left:0;right:0;top:20%;height:2px;border-radius:2px;
        background:linear-gradient(90deg,transparent,#93C5FD,transparent);
        animation:ppNuage 4.2s linear infinite}
      .pp-n2{animation-delay:1.4s}.pp-n3{animation-delay:2.8s}
      @media (prefers-reduced-motion:reduce){.pp-balancier,.pp-flotte,.pp-nuage{animation:none}}
    </style>
  </head>
  <body>
    <!-- Écran de chargement AVANT le démarrage de React : le bundle pèse plusieurs
         Mo, donc sur une connexion faible (DZ isolée, 4G capricieuse) l'utilisateur
         voyait une page vide pendant plusieurs secondes. Ce visuel est inline
         (aucune requête supplémentaire) et React le remplace en montant. -->
    <div id="root">
      <div class="pp-boot">
        <div class="pp-ciel">
          <span class="pp-nuage"></span>
          <span class="pp-nuage pp-n2"></span>
          <span class="pp-nuage pp-n3"></span>
          <div class="pp-balancier"><div class="pp-flotte">
            <img class="pp-para" src="/icons/parachutiste.png" alt="" aria-hidden="true">
          </div></div>
        </div>
        <p>Chargement de votre carnet…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
