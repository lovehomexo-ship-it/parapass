<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <!-- Icône d'écran d'accueil iOS : iOS ignore le manifest et utilise CETTE balise. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ParaPass" />
    <!-- Manifest OBLIGATOIRE : sans lui le navigateur ne lit jamais manifest.json
         → PWA non installable correctement et push iOS impossible (exigence Apple). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ParaPass — Carnet de sauts numérique FFP</title>
    <meta name="description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parapass.fr" />
    <meta property="og:title" content="ParaPass — Carnet de sauts numérique FFP" />
    <meta property="og:description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />
    <meta property="og:image" content="https://parapass.fr/Logo_ParaPass.png" />
    <meta property="og:image:alt" content="Logo ParaPass" />
    <meta property="og:site_name" content="ParaPass" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParaPass — Carnet de sauts numérique FFP" />
    <meta name="twitter:description" content="Le carnet de sauts numérique pour parachutistes. Validé par vos moniteurs en temps réel, accessible partout, même sans connexion." />
    <meta name="twitter:image" content="https://parapass.fr/Logo_ParaPass.png" />
    <style>
      /* Écran de démarrage : styles inline pour s'afficher sans attendre le CSS. */
      .pp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:16px;background:#001A4D;
        font-family:Inter,system-ui,-apple-system,sans-serif}
      .pp-boot p{margin:0;font-size:14px;color:#94A3B8}
      @keyframes ppOrbite{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .pp-orbite{transform-origin:60px 60px;animation:ppOrbite 2.8s linear infinite}
      @media (prefers-reduced-motion: reduce){.pp-orbite{animation:none}}
    </style>
  </head>
  <body>
    <!-- Écran de chargement AVANT le démarrage de React : le bundle pèse plusieurs
         Mo, donc sur une connexion faible (DZ isolée, 4G capricieuse) l'utilisateur
         voyait une page vide pendant plusieurs secondes. Ce visuel est inline
         (aucune requête supplémentaire) et React le remplace en montant. -->
    <div id="root">
      <div class="pp-boot">
        <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Chargement de ParaPass">
          <defs>
            <radialGradient id="pp-halo" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="pp-voile" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#93C5FD"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="46" fill="url(#pp-halo)"/>
          <circle cx="60" cy="60" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
          <circle cx="60" cy="60" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
          <circle cx="60" cy="60" r="14" fill="none" stroke="#F97316" stroke-opacity="0.55" stroke-width="1.5"/>
          <circle cx="60" cy="60" r="3.2" fill="#F97316"/>
          <g class="pp-orbite">
            <path d="M 60 18 A 42 42 0 0 1 96 39" fill="none" stroke="#60A5FA" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
            <g transform="translate(60 18)"><g transform="rotate(90)">
              <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="url(#pp-voile)"/>
              <line x1="-4.5" y1="-8" x2="4.5" y2="-8" stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="0.7"/>
              <line x1="-4.5" y1="-4" x2="4.5" y2="-4" stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="0.7"/>
              <line x1="-4.5" y1="0"  x2="4.5" y2="0"  stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="0.7"/>
              <line x1="-4.5" y1="4"  x2="4.5" y2="4"  stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="0.7"/>
              <line x1="-4.5" y1="8"  x2="4.5" y2="8"  stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="0.7"/>
              <line x1="0" y1="12" x2="0" y2="17" stroke="#1E3A8A" stroke-opacity="0.5" stroke-width="0.8"/>
              <circle cx="0" cy="18.5" r="2.2" fill="#0F2547"/>
            </g></g>
          </g>
        </svg>
        <p>Chargement de votre carnet…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
